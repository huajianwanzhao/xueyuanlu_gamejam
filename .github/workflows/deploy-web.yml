name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装导出模板
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -r /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type d

      - name: 导入资源
        run: |
          godot --headless --import 2>&1 | tail -n 20 || true

      - name: 导出 Web 版
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tail -n 40
          echo "---- 产物 ----"
          ls -lh build/web
          test -f build/web/index.html
          test -f build/web/index.pck

      - name: 启用 / 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v4
