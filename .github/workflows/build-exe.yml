name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装导出模板
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          if [ -d /root/.local/share/godot/export_templates ]; then
            cp -r /root/.local/share/godot/export_templates/. "$HOME/.local/share/godot/export_templates/"
          fi
          find "$HOME/.local/share/godot/export_templates" -maxdepth 2 -type d

      - name: 导入资源
        run: |
          godot --headless --import 2>&1 | tail -n 20 || true

      - name: 导出 Windows 版
        run: |
          mkdir -p build/win
          godot --headless --export-release "Windows Desktop" build/win/xueyuanlu.exe 2>&1 | tail -n 40
          echo "---- 产物 ----"
          ls -lh build/win
          test -f build/win/xueyuanlu.exe

      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/win/xueyuanlu.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载 exe
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh dist
          gh release create "${{ github.ref_name }}" dist/xueyuanlu.exe \
            --title "学院路 Game Jam ${{ github.ref_name }}" \
            --generate-notes
